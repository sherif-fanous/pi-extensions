[env]
_.file = ".env"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.changeset]
run = "changeset add"

[tasks.changeset-check]
# Fails on a pending changeset that `mise run version` would reject.
run = "node packages/pi-extensions-release/src/check.ts"

[tasks.check]
# Checks the root and every package at once. Each runs its steps in order and
# keeps going after a failed step, and each step writes to its own log, so
# output never interleaves. Each prints one line when it finishes; the logs of
# the failed steps follow once all are done.
quiet = true
run = '''
logs=$(mktemp -d)
trap 'rm -rf "$logs"' EXIT
[ -t 1 ] && export FORCE_COLOR=1

# check NAME DIR STEP...: runs each STEP's mise task in DIR.
check() {
  name=$1 dir=$2
  shift 2
  start=$(date +%s) failed=""
  for step in "$@"; do
    if ! (cd "$dir" && mise run --quiet "$step") >"$logs/$name.$step.log" 2>&1; then
      failed="$failed $step"
      echo "$name $step" >>"$logs/failed"
    fi
  done
  seconds=$(( $(date +%s) - start ))
  if [ -z "$failed" ]; then
    printf '✓ %s (%ss)\n' "$name" "$seconds"
  else
    printf '✗ %s:%s (%ss)\n' "$name" "$failed" "$seconds"
  fi
}

check root . changeset-check format-check &
for dir in packages/*/; do
  check "$(basename "$dir")" "$dir" format-check type-check lint test &
done
wait
[ -f "$logs/failed" ] || exit 0
sort "$logs/failed" | while read -r name step; do
  printf '\n━━ %s: %s ━━\n' "$name" "$step"
  cat "$logs/$name.$step.log"
done
exit 1
'''

# Prettier skips what .gitignore and .prettierignore list; each package
# formats its own files. Every package.json is sorted from here.
[tasks.format]
run = "sort-package-json package.json 'packages/*/package.json' && prettier --write . '!packages/**'"

[tasks.format-check]
run = "sort-package-json --check package.json 'packages/*/package.json' && prettier --check . '!packages/**'"

[tasks.publish]
depends = ["check"]
# Publishes every package whose version is not on npm yet, dependencies
# first, and tags each release `<name>@<version>`. pnpm 12 stopped expanding
# `${NPM_ACCESS_TOKEN}` from .npmrc, so the token goes straight to pnpm as
# npm-style config instead.
run = '''
: "${NPM_ACCESS_TOKEN:?Set NPM_ACCESS_TOKEN in .env to an npm token with publish rights for @sherif-fanous}"
exec env "npm_config_//registry.npmjs.org/:_authToken=$NPM_ACCESS_TOKEN" changeset publish
'''

[tasks.version]
# Use this instead of `changeset version`, which refuses to run: see
# packages/pi-extensions-release.
run = "node packages/pi-extensions-release/src/version.ts"

# Major versions only: the newest release within each. Moving to a new major
# is a change to this file.
[tools]
node = "24"
"npm:pnpm" = "12"
