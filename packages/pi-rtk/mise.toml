[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.check]
depends = ["format-check", "type-check", "lint", "test"]

# Prettier reads ignore files only from the current directory, so these point
# it at the root ones.
[tasks.format]
run = "prettier --write --ignore-path ../../.gitignore --ignore-path ../../.prettierignore ."

[tasks.format-check]
run = "prettier --check --ignore-path ../../.gitignore --ignore-path ../../.prettierignore ."

[tasks.lint]
run = "eslint ."

[tasks.lint-fix]
run = "eslint . --fix"

[tasks.test]
run = "vitest --run"

[tasks.test-watch]
run = "vitest"

[tasks.type-check]
run = "tsc --noEmit"
