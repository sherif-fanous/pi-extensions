[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.check]
depends = ["format-check", "type-check", "lint", "test"]

[tasks.format]
run = "prettier --write package.json src/. tests/. tsconfig.json vitest.config.ts *.md openspec/specs"

[tasks.format-check]
run = "prettier --check package.json src/. tests/. tsconfig.json vitest.config.ts *.md openspec/specs"

[tasks.install-deps]
run = "pnpm add --save-prod"

[tasks.install-dev-deps]
run = "pnpm add --save-dev"

[tasks.lint]
run = "biome lint src/. tests/. && eslint src/. tests/."

[tasks.lint-fix]
run = "biome lint src/. tests/. --fix && eslint src/. tests/. --fix"

[tasks.login]
run = "pnpm login"

[tasks.pack-check]
depends = ["check"]
run = "pnpm pack --dry-run"

[tasks.sort-package-json]
run = "sort-package-json"

[tasks.test]
run = "vitest --run"

[tasks.test-watch]
run = "vitest"

[tasks.type-check]
run = "tsc --noEmit"

[tasks.uninstall-deps]
run = "pnpm remove"

[tasks.update-deps]
run = "pnpm update"

[tools]
node = "lts"
"npm:pnpm" = "latest"
